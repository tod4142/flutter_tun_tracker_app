name: flutter_tun_tracker_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  font_awesome_flutter: ^11.0.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
